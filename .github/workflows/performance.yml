name: Performance profiles and emulator metrics
on:
  push:
    paths: ['app/**', 'core/**', 'praytimes/**', 'benchmark/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'scripts/performance_ci.sh', 'scripts/merge_profiles.py', '.github/workflows/performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profiles-and-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - &performance-android-toolchain
        name: Install checksum-pinned Android tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          hayya_sdk_root="$RUNNER_TEMP/hayya-android-sdk"
          archive="$RUNNER_TEMP/hayya-android-tools.zip"
          curl --fail --location --retry 3 --output "$archive" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          printf '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  %s\n' "$archive" | sha256sum --check
          mkdir -p "$hayya_sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$hayya_sdk_root/cmdline-tools"
          mv "$hayya_sdk_root/cmdline-tools/cmdline-tools" "$hayya_sdk_root/cmdline-tools/latest"
          rm "$archive"
          manager="$hayya_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$hayya_sdk_root" --licenses < <(yes) > /dev/null
          "$manager" --sdk_root="$hayya_sdk_root" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$hayya_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$hayya_sdk_root" >> "$GITHUB_ENV"
          echo "$hayya_sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$hayya_sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/performance_ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profiles-and-emulator-metrics-${{ github.sha }}
          include-hidden-files: true
          path: |
            build/reports/dependency-verification/
            app/src/main/baseline-prof.txt
            app/src/main/startup-prof.txt
            benchmark/build/outputs/connected_android_test_additional_output/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/reports/androidTests/
          retention-days: 14
