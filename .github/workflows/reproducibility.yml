name: Reproducible release checks
on:
  push:
    paths-ignore: ['**/*.md', 'fastlane/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-${{ matrix.copy }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - &release-android-toolchain
        name: Install checksum-pinned Android tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          hayya_sdk_root="$RUNNER_TEMP/hayya-android-sdk"
          archive="$RUNNER_TEMP/hayya-android-tools.zip"
          curl --fail --location --retry 3 --output "$archive" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          printf '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  %s\n' "$archive" | sha256sum --check
          mkdir -p "$hayya_sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$hayya_sdk_root/cmdline-tools"
          mv "$hayya_sdk_root/cmdline-tools/cmdline-tools" "$hayya_sdk_root/cmdline-tools/latest"
          rm "$archive"
          manager="$hayya_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$hayya_sdk_root" --licenses < <(yes) > /dev/null
          "$manager" --sdk_root="$hayya_sdk_root" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$hayya_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$hayya_sdk_root" >> "$GITHUB_ENV"
          echo "$hayya_sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$hayya_sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Build unsigned production identity from a clean checkout
        working-directory: source-${{ matrix.copy }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease :app:lintRelease --no-daemon --no-build-cache
          python3 scripts/check_manifest.py
          python3 scripts/check_release.py
          bash scripts/prepare_review_kit.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-${{ matrix.copy }}-${{ github.sha }}
          path: source-${{ matrix.copy }}/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-reports-${{ matrix.copy }}-${{ github.sha }}
          path: |
            source-${{ matrix.copy }}/release-review/
            source-${{ matrix.copy }}/app/build/reports/
            source-${{ matrix.copy }}/app/build/outputs/mapping/release/
            source-${{ matrix.copy }}/app/build/outputs/bundle/release/
          retention-days: 14
  compare:
    needs: rebuild
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          pattern: rebuild-*
          path: rebuilt
      - name: Require byte-identical unsigned APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find rebuilt -name '*.apk' -print0 | sort -z)
          test "${#apks[@]}" -eq 2
          sha256sum "${apks[@]}" | tee SHA256SUMS
          cmp "${apks[0]}" "${apks[1]}"
          echo 'Independent clean builds produced byte-identical unsigned APKs.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility-${{ github.sha }}
          path: SHA256SUMS
          retention-days: 30
