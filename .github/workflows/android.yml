name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Check core, upstream fixtures, lint and APKs
        env:
          QA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :core:test :praytimes:test :app:lintDebug :app:assembleDebug :app:assembleQa :app:assembleDebugAndroidTest --no-daemon
      - name: Verify offline manifest
        run: python3 scripts/check_manifest.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-${{ github.sha }}
          path: |
            app/build/outputs/apk/
            app/build/reports/
            core/build/reports/tests/
            praytimes/build/reports/tests/
          retention-days: 14
  screenshots:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/capture_ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          include-hidden-files: true
          path: |
            .ci-screenshots/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 14
  qa-sign:
    needs: build
    if: github.event_name == 'push' && github.repository == 'sal0-h/hayya-alal-salah'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-${{ github.sha }}
          path: unsigned
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Sign internal QA build with dedicated identity
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$QA_KEYSTORE_BASE64" && test -n "$QA_KEYSTORE_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/hayya-qa.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apk=$(find unsigned -name 'app-qa-unsigned.apk' -print -quit)
          test -n "$apk"
          mkdir -p qa-artifact
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keystore" --ks-key-alias hayya-qa --ks-pass env:QA_KEYSTORE_PASSWORD --out "qa-artifact/hayya-qa-${{ github.sha }}.apk" "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "qa-artifact/hayya-qa-${{ github.sha }}.apk"
          (cd qa-artifact && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-${{ github.sha }}
          path: qa-artifact/
          retention-days: 30
